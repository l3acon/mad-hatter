---
# OpenSCAP compliance remediation against a provisioned host.
# Applies the selected SCAP profile with --remediate, then re-scans to
# produce a post-remediation score. Results are published via set_stats
# for downstream workflow nodes (CMDB enrich, incident close/update).
#
# Three-play structure:
#   Play 1 (localhost): resolve target, add to in-memory inventory
#   Play 2 (target):    install scanner, remediate, re-scan, collect results
- name: Compliance remediation — prepare target
  hosts: localhost
  gather_facts: false
  vars:
    snow_target_host: ""
    snow_vm_name: ""
    snow_host_ip: ""
    oscap_profile: "xccdf_org.ssgproject.content_profile_cis_server_l1"
    oscap_datastream: "/usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml"
    oscap_fail_threshold: 80
  tasks:
    - name: Resolve target from survey / inventory
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/resolve_target.yml"
      vars:
        resolve_default_name: remediated-host

    - name: Add target to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ _target_name }}"
        ansible_host: "{{ _target_ip }}"
        ansible_user: "{{ hostvars[_target_name]['ansible_user'] | default('ec2-user') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: scan_targets
        oscap_profile: "{{ oscap_profile }}"
        oscap_datastream: "{{ oscap_datastream }}"
        oscap_fail_threshold: "{{ oscap_fail_threshold }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ _target_ip }}"
        port: 22
        delay: 5
        timeout: 120

- name: Compliance remediation — apply profile and verify
  hosts: scan_targets
  gather_facts: true
  become: true
  vars:
    _report_dir: /tmp
  tasks:
    - name: Ensure OpenSCAP packages are installed
      ansible.builtin.dnf:
        name:
          - openscap-scanner
          - scap-security-guide
        state: present

    # ── Step 1: Remediate ──────────────────────────────────────────────────
    - name: Apply OpenSCAP remediation
      ansible.builtin.command: >-
        oscap xccdf eval
          --remediate
          --profile {{ oscap_profile }}
          --results-arf {{ _report_dir }}/oscap-remediate-arf-{{ inventory_hostname }}.xml
          {{ oscap_datastream }}
      register: _oscap_remediate
      failed_when: _oscap_remediate.rc not in [0, 2]
      changed_when: _oscap_remediate.rc == 2

    - name: Display remediation result
      ansible.builtin.debug:
        msg: >-
          Remediation exit code: {{ _oscap_remediate.rc }}
          (0=all pass/fixed, 2=some findings remain)

    # ── Step 2: Re-scan to get post-remediation score ──────────────────────
    - name: Run post-remediation compliance scan
      ansible.builtin.command: >-
        oscap xccdf eval
          --profile {{ oscap_profile }}
          --results-arf {{ _report_dir }}/oscap-arf-{{ inventory_hostname }}.xml
          --report {{ _report_dir }}/oscap-report-{{ inventory_hostname }}.html
          {{ oscap_datastream }}
      register: _oscap_result
      failed_when: _oscap_result.rc not in [0, 2]
      changed_when: false

    - name: Parse pass/fail counts from ARF results
      ansible.builtin.shell: |
        pass=$(grep -c '<result>pass</result>' {{ _report_dir }}/oscap-arf-{{ inventory_hostname }}.xml || true)
        fail=$(grep -c '<result>fail</result>' {{ _report_dir }}/oscap-arf-{{ inventory_hostname }}.xml || true)
        pass=${pass:-0}
        fail=${fail:-0}
        total=$((pass + fail))
        if [ "$total" -gt 0 ]; then
          score=$((pass * 100 / total))
        else
          score=0
        fi
        echo "{\"pass\": $pass, \"fail\": $fail, \"total\": $total, \"score\": $score}"
      register: _oscap_counts
      changed_when: false

    - name: Set compliance facts
      ansible.builtin.set_fact:
        _compliance: "{{ _oscap_counts.stdout | from_json }}"
        _oscap_rc: "{{ _oscap_result.rc }}"

    - name: Fetch HTML report to controller
      ansible.builtin.fetch:
        src: "{{ _report_dir }}/oscap-report-{{ inventory_hostname }}.html"
        dest: "/tmp/oscap-report-{{ inventory_hostname }}.html"
        flat: true

    - name: Display compliance summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Profile: {{ oscap_profile }}"
          - "Post-remediation score: {{ _compliance.score }}% ({{ _compliance.pass }} pass / {{ _compliance.fail }} fail)"
          - "Threshold: {{ oscap_fail_threshold }}%"
          - "Result: {{ 'PASS' if (_compliance.score | int) >= (oscap_fail_threshold | int) else 'BELOW THRESHOLD' }}"

    - name: Publish compliance results for downstream workflow nodes
      ansible.builtin.set_stats:
        data:
          snow_compliance_score: "{{ _compliance.score }}"
          snow_compliance_pass: "{{ _compliance.pass }}"
          snow_compliance_fail: "{{ _compliance.fail }}"
          snow_compliance_total: "{{ _compliance.total }}"
          snow_compliance_profile: "{{ oscap_profile }}"
          snow_compliance_host: "{{ ansible_host }}"
          snow_compliance_failed: "{{ (_compliance.score | int) < (oscap_fail_threshold | int) }}"
          snow_ci_identifier: "{{ hostvars['localhost']['_target_name'] | default(ansible_host) }}"
          snow_ci_attributes_json: >-
            {{ {
              "short_description": "Compliance: " + _compliance.score | string + "% (" + oscap_profile + ") [remediated]",
              "attributes": "oscap_score=" + _compliance.score | string + ";oscap_profile=" + oscap_profile
            } | to_json }}
          snow_incident_short_description: >-
            Compliance remediation on {{ ansible_host }} — post-score {{ _compliance.score }}% (threshold {{ oscap_fail_threshold }}%)
          snow_incident_description: >-
            OpenSCAP remediation results for {{ ansible_host }}:
            Profile: {{ oscap_profile }}
            Post-remediation score: {{ _compliance.score }}% ({{ _compliance.pass }} pass / {{ _compliance.fail }} fail)
            Threshold: {{ oscap_fail_threshold }}%
          snow_incident_close_code: >-
            {{ 'Solved (Permanently)'
               if (_compliance.score | int) >= (oscap_fail_threshold | int)
               else 'Solved (Work Around)' }}
          snow_incident_close_notes: >-
            [Ansible Automation Platform] Compliance remediation completed on {{ ansible_host }}.
            Profile: {{ oscap_profile }}.
            Post-remediation score: {{ _compliance.score }}% ({{ _compliance.pass }} pass / {{ _compliance.fail }} fail).
            Threshold: {{ oscap_fail_threshold }}%.
            Result: {{ 'PASS' if (_compliance.score | int) >= (oscap_fail_threshold | int) else 'BELOW THRESHOLD — review recommended' }}.

    - name: Fail play if score is below threshold (drives workflow branching)
      ansible.builtin.fail:
        msg: >-
          Post-remediation score {{ _compliance.score }}% is below threshold {{ oscap_fail_threshold }}%.
          Incident will not be closed automatically.
      when: (_compliance.score | int) < (oscap_fail_threshold | int)
