---
# Self-contained: create a RHEL 9 VM, wait for SSH, install a package — all in
# a single job template. Designed for the self-service portal which cannot
# launch workflows.
#
# Expects: ocpv_vm_name, ocpv_vm_namespace, ocpv_post_package_name
# Optional: ocpv_instancetype_name, ocpv_preference_name, ocpv_ssh_public_key
- name: Provision RHEL 9 VM and install package
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Validate required job variables
      ansible.builtin.assert:
        that:
          - ocpv_vm_name is defined and ocpv_vm_name | length > 0
          - ocpv_vm_namespace is defined and ocpv_vm_namespace | length > 0
          - ocpv_post_package_name is defined and ocpv_post_package_name | length > 0
        fail_msg: >-
          Set ocpv_vm_name, ocpv_vm_namespace, and ocpv_post_package_name.

    # ── Create the VM ────────────────────────────────────────────────────
    - name: Ensure target namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ ocpv_vm_namespace }}"
        state: present

    - name: Build cloud-init user data
      ansible.builtin.set_fact:
        ocpv_cloudinit_userdata: |
          #cloud-config
          user: cloud-user
          {% if ocpv_ssh_public_key | default('') | trim | length > 0 %}
          ssh_authorized_keys:
            - "{{ ocpv_ssh_public_key | trim }}"
          {% endif %}
      when: ocpv_cloudinit_userdata is not defined

    - name: Create VirtualMachine
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ ocpv_vm_name }}"
        namespace: "{{ ocpv_vm_namespace }}"
        state: present
        instancetype:
          name: "{{ ocpv_instancetype_name | default('u1.medium') }}"
        preference:
          name: "{{ ocpv_preference_name | default('rhel.9') }}"
        data_volume_templates:
          - metadata:
              name: "{{ ocpv_vm_name }}-rootdisk"
            spec:
              sourceRef:
                kind: DataSource
                name: "{{ ocpv_datasource_name | default('rhel9') }}"
                namespace: openshift-virtualization-os-images
              storage:
                resources:
                  requests:
                    storage: "{{ ocpv_rootdisk_size | default('30Gi') }}"
        spec:
          domain:
            devices:
              interfaces:
                - name: default
                  masquerade: {}
          networks:
            - name: default
              pod: {}
          volumes:
            - name: rootdisk
              dataVolume:
                name: "{{ ocpv_vm_name }}-rootdisk"
            - name: cloudinit
              cloudInitNoCloud:
                userData: "{{ ocpv_cloudinit_userdata }}"
        wait: true
        wait_timeout: 600

    # ── Wait for guest IP and SSH ────────────────────────────────────────
    - name: Wait until VMI reports a guest IP
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ ocpv_vm_name }}"
        namespace: "{{ ocpv_vm_namespace }}"
      register: _vmi
      until: >-
        _vmi.resources | length > 0
        and (_vmi.resources[0].status.interfaces | default([])
             | selectattr('ipAddress', 'defined')
             | map(attribute='ipAddress')
             | list | length > 0)
      retries: 40
      delay: 15

    - name: Extract guest IP
      ansible.builtin.set_fact:
        _guest_ip: >-
          {{ _vmi.resources[0].status.interfaces
             | selectattr('ipAddress', 'defined')
             | map(attribute='ipAddress')
             | first }}

    - name: Wait for SSH on guest
      ansible.builtin.wait_for:
        host: "{{ _guest_ip }}"
        port: 22
        delay: 10
        timeout: 600
        state: started

    - name: Add guest to in-memory inventory
      ansible.builtin.add_host:
        name: ocpv_guest
        groups: ocpv_guests
        ansible_host: "{{ _guest_ip }}"
        ansible_user: "{{ ocpv_ssh_user | default('cloud-user') }}"
        ansible_connection: ssh
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    - name: Display provisioning summary
      ansible.builtin.debug:
        msg:
          - "VM {{ ocpv_vm_name }} created in {{ ocpv_vm_namespace }}"
          - "Guest IP: {{ _guest_ip }}"
          - "Installing package: {{ ocpv_post_package_name }}"

# ── Install package on guest ─────────────────────────────────────────────────
- name: Install requested package on guest
  hosts: ocpv_guests
  gather_facts: false
  tasks:
    - name: Install package with dnf
      ansible.builtin.dnf:
        name: "{{ ocpv_post_package_name }}"
        state: present
      become: true

    - name: Confirm installation
      ansible.builtin.debug:
        msg: "Package '{{ ocpv_post_package_name }}' installed on {{ inventory_hostname }}"
