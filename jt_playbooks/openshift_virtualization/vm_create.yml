---
# Create a VirtualMachine using redhat.openshift_virtualization.kubevirt_vm
# Attach an OpenShift/Kubernetes bearer token credential on the job template so
# K8S_AUTH_* is injected (same pattern as infra.openshift_virtualization_ops playbooks).
- name: Create OpenShift Virtualization VM
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Validate required job variables
      ansible.builtin.assert:
        that:
          - ocpv_vm_name is defined and ocpv_vm_name | length > 0
          - ocpv_vm_namespace is defined and ocpv_vm_namespace | length > 0
        fail_msg: >-
          Set ocpv_vm_name and ocpv_vm_namespace (for example via job template survey).

    - name: Ensure target namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ ocpv_vm_namespace }}"
        state: present

    - name: Build cloud-init user data
      ansible.builtin.set_fact:
        ocpv_cloudinit_userdata: |
          #cloud-config
          user: cloud-user
          {% if ocpv_ssh_public_key | default('') | trim | length > 0 %}
          ssh_authorized_keys:
            - "{{ ocpv_ssh_public_key | trim }}"
          {% endif %}
      when: ocpv_cloudinit_userdata is not defined

    - name: Create VirtualMachine
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ ocpv_vm_name }}"
        namespace: "{{ ocpv_vm_namespace }}"
        state: present
        labels: "{{ ocpv_vm_labels | default(omit) }}"
        instancetype:
          name: "{{ ocpv_instancetype_name | default('u1.medium') }}"
        preference:
          name: "{{ ocpv_preference_name | default('rhel.9') }}"
        data_volume_templates: "{{ ocpv_data_volume_templates | default(_ocpv_default_dvt) }}"
        spec:
          domain:
            devices:
              interfaces:
                - name: default
                  masquerade: {}
          networks:
            - name: default
              pod: {}
          volumes: "{{ ocpv_vm_volumes | default(_ocpv_default_volumes) }}"
        wait: "{{ ocpv_vm_wait | default(true) }}"
        wait_timeout: "{{ ocpv_vm_wait_timeout | default(600) }}"
      vars:
        _ocpv_default_dvt:
          - metadata:
              name: "{{ ocpv_vm_name }}-rootdisk"
            spec:
              sourceRef:
                kind: DataSource
                name: "{{ ocpv_datasource_name | default('rhel9') }}"
                namespace: openshift-virtualization-os-images
              storage:
                resources:
                  requests:
                    storage: "{{ ocpv_rootdisk_size | default('30Gi') }}"
        _ocpv_default_volumes:
          - name: rootdisk
            dataVolume:
              name: "{{ ocpv_vm_name }}-rootdisk"
          - name: cloudinit
            cloudInitNoCloud:
              userData: "{{ ocpv_cloudinit_userdata }}"
