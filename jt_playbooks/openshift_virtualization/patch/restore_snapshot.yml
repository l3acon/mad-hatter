---
# Restore VMs from VirtualMachineSnapshot (rollback on patch failure).
- name: Restore VirtualMachines from snapshot
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ocpv_patch_namespace: "{{ ocpv_vm_namespace | default('virt-rhel') }}"
    ocpv_patch_vm_names: "{{ ocpv_patch_targets.split(',') | map('trim') | list }}"
    ocpv_snapshot_prefix: "patch-snapshot"
  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - ocpv_patch_targets is defined and ocpv_patch_targets | length > 0

    - name: Stop VMs before restore
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ item }}"
        namespace: "{{ ocpv_patch_namespace }}"
        run_strategy: Halted
        wait: true
        wait_timeout: 300
      loop: "{{ ocpv_patch_vm_names }}"
      failed_when: false

    - name: Create VirtualMachineRestore for each target
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: snapshot.kubevirt.io/v1beta1
          kind: VirtualMachineRestore
          metadata:
            name: "patch-restore-{{ item }}"
            namespace: "{{ ocpv_patch_namespace }}"
          spec:
            target:
              apiGroup: kubevirt.io
              kind: VirtualMachine
              name: "{{ item }}"
            virtualMachineSnapshotName: "{{ ocpv_snapshot_prefix }}-{{ item }}"
      loop: "{{ ocpv_patch_vm_names }}"

    - name: Wait for restores to complete
      kubernetes.core.k8s_info:
        api_version: snapshot.kubevirt.io/v1beta1
        kind: VirtualMachineRestore
        name: "patch-restore-{{ item }}"
        namespace: "{{ ocpv_patch_namespace }}"
      register: _restore
      until: >-
        _restore.resources | length > 0
        and (_restore.resources[0].status.complete | default(false) | bool)
      retries: 30
      delay: 10
      loop: "{{ ocpv_patch_vm_names }}"

    - name: Restart VMs after restore
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ item }}"
        namespace: "{{ ocpv_patch_namespace }}"
        run_strategy: Always
        wait: true
        wait_timeout: 300
      loop: "{{ ocpv_patch_vm_names }}"

    - name: Display restore summary
      ansible.builtin.debug:
        msg: "Restored {{ ocpv_patch_vm_names | join(', ') }} from pre-patch snapshots"
