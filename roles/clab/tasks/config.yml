---
- name: Sync images
  containers.podman.podman_image:
    name: "{{ item }}"
    state: present
  loop: "{{ clab_images }}"

- name: Install ContainerLab
  ansible.builtin.shell: bash -c "$(curl -sL https://get.containerlab.dev)"

- name: Copy Clab Files
  ansible.builtin.copy:
    src: clab/
    dest: ~/clab/

- name: Render device credentials before starting containers
  ansible.builtin.include_tasks: render_configs.yml
  vars:
    clab_config_source_dir: "{{ role_path }}/files/clab/{{ clab_topology_deployment }}/configs"
    clab_config_dest_dir: "/root/clab/{{ clab_topology_deployment }}/configs"

- name: "Start containers for {{ clab_topology_deployment }} deployment"
  ansible.builtin.shell:
    cmd: containerlab deploy --reconfigure --runtime podman
    chdir: "/root/clab/{{ clab_topology_deployment }}/"
  environment:
    DOCKER_HOST: "unix:///run/user/1000/podman/podman.sock"
  retries: 2
