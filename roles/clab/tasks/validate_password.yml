---
- name: Require an explicit ContainerLab device password
  ansible.builtin.assert:
    that:
      - clab_device_password | default('', true) | string | trim | length > 0
      - clab_device_password is match('^[A-Za-z0-9!@#%^*()_+=.,:-]+$')
    fail_msg: >-
      Set clab_device_password or CLAB_DEVICE_PASSWORD before deploying ContainerLab.
      Device configuration supports letters, digits, and !@#%^*()_+=.,:- without whitespace.
