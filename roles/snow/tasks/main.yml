---
- name: Assert required variables and credentials
  ansible.builtin.assert:
    that:
      - aap_hostname is defined
      - aap_username is defined
      - aap_password is defined
      - snow_instance | length > 0
      - snow_username | length > 0
      - snow_password | length > 0
    fail_msg: >-
      Missing required variables. Ensure aap_hostname, aap_username, aap_password,
      and SNOW_INSTANCE/SNOW_USERNAME/SNOW_PASSWORD environment variables are set.

- name: Build ServiceNow credential for dispatch
  ansible.builtin.set_fact:
    snow_controller_credentials:
      - name: Controller Credential
        organization: Default
        credential_type: Red Hat Ansible Automation Platform
        update_secrets: false
        inputs:
          host: "{{ aap_hostname }}"
          username: "{{ aap_username }}"
          password: "{{ aap_password }}"
          verify_ssl: "{{ snow_aap_verify_ssl }}"

      - name: "{{ snow_aap_credential_name }}"
        credential_type: ServiceNow
        organization: Default
        update_secrets: true
        inputs:
          instance: "{{ snow_instance }}"
          username: "{{ snow_username }}"
          password: "{{ snow_password }}"

- name: Build EC2 SSH credential if key file exists
  ansible.builtin.set_fact:
    _snow_ec2_ssh_credential: >-
      {{
        [
          {
            'name': snow_aap_ec2_ssh_credential_name,
            'credential_type': 'Machine',
            'organization': 'Default',
            'update_secrets': true,
            'inputs': {
              'username': snow_aap_ec2_ssh_username,
              'ssh_key_data': lookup('file', snow_aap_ec2_ssh_private_key_file),
            },
          },
        ]
        if (snow_aap_ec2_ssh_private_key_file is defined
            and lookup('file', snow_aap_ec2_ssh_private_key_file, errors='ignore'))
        else []
      }}
  no_log: true

- name: Build merged controller credentials # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    controller_credentials: >-
      {{
        snow_controller_credentials
        + _snow_ec2_ssh_credential
        + (snow_extra_controller_credentials | default([]))
      }}
  no_log: true

- name: Ensure ServiceNow CMDB inventory exists
  ansible.controller.inventory:
    name: "{{ snow_aap_inventory_name }}"
    organization: Default
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"

- name: Ensure ServiceNow Runtime inventory exists
  ansible.controller.inventory:
    name: "{{ snow_aap_runtime_inventory_name }}"
    organization: Default
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"

- name: Ensure ContainerLab inventory exists
  ansible.controller.inventory:
    name: "{{ snow_clab_inventory_name }}"
    organization: Default
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"

- name: Ensure ContainerLab inventory hosts exist
  ansible.controller.host:
    name: "{{ item.name }}"
    inventory: "{{ snow_clab_inventory_name }}"
    enabled: true
    variables: "{{ item.variables }}"
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"
  loop:
    - name: n9kv
      variables:
        ansible_port: 2122
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: "admin@123"
        ansible_connection: ansible.netcommon.network_cli
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    - name: cat8kv
      variables:
        ansible_port: 2123
        ansible_network_os: cisco.ios.ios
        ansible_user: admin
        ansible_password: "admin@123"
        ansible_connection: ansible.netcommon.network_cli
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure ContainerLab inventory groups exist
  ansible.controller.group:
    name: "{{ item.name }}"
    inventory: "{{ snow_clab_inventory_name }}"
    hosts: "{{ item.hosts }}"
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"
  loop:
    - name: clab_nxos
      hosts:
        - n9kv
    - name: clab_ios
      hosts:
        - cat8kv
    - name: containerlab
      hosts:
        - n9kv
        - cat8kv
  loop_control:
    label: "{{ item.name }}"

- name: Ensure Containerlab SSH credential exists (placeholder)
  ansible.controller.credential:
    name: Containerlab SSH
    organization: Default
    credential_type: Machine
    state: exists
    inputs:
      username: ec2-user
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"

- name: Ensure Containerlab Device Access credential exists
  ansible.controller.credential:
    name: Containerlab Device Access
    organization: Default
    credential_type: Machine
    inputs:
      username: admin
      password: "admin@123"
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"

- name: Create self-service portal user on the controller
  when: snow_ssp_user_enabled | bool
  ansible.controller.user:
    username: "{{ snow_ssp_user_name }}"
    password: "{{ snow_ssp_user_password }}"
    first_name: ServiceNow
    last_name: Self-Service
    is_superuser: false
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ snow_aap_verify_ssl }}"
  register: _snow_user_result
  ignore_errors: true

- name: Warn if user creation failed
  when:
    - snow_ssp_user_enabled | bool
    - _snow_user_result is failed
  ansible.builtin.debug:
    msg: "WARNING: Could not create SSP user '{{ snow_ssp_user_name }}' — {{ _snow_user_result.msg | default('unknown error') }}. Skipping RBAC."

- name: Disable RBAC dispatch if user creation failed
  when:
    - snow_ssp_user_enabled | bool
    - _snow_user_result is failed
  ansible.builtin.set_fact:
    controller_roles: []

- name: Build inventory source configuration for CMDB
  ansible.builtin.set_fact:
    snow_controller_inventory_sources:
      - name: "ServiceNow CMDB Source"
        inventory: "{{ snow_aap_inventory_name }}"
        organization: Default
        description: >-
          ServiceNow CMDB dynamic inventory (servicenow.itsm.now inventory plugin).
          Syncs {{ snow_cmdb_table }} with filter: {{ snow_cmdb_filter }}.
        source: scm
        source_project: "{{ snow_aap_project_name }}"
        source_path: roles/snow/files/snow_cmdb.now.yml
        credential: "{{ snow_aap_credential_name }}"
        execution_environment: "{{ snow_aap_ee_name }}"
        overwrite: true
        update_on_launch: true
        update_cache_timeout: 0
        timeout: 600
        verbosity: 1

- name: Publish CasC lists for dispatch (nested role defaults would otherwise mask ours)
  ansible.builtin.set_fact:
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    controller_credential_types: "{{ controller_credential_types }}"
    controller_execution_environments: "{{ controller_execution_environments }}"
    controller_projects: "{{ controller_projects }}"
    controller_inventories: []
    controller_inventory_sources: "{{ snow_controller_inventory_sources }}"
    controller_hosts: "{{ controller_hosts }}"
    controller_workflows: "{{ controller_workflows }}"
    controller_roles: "{{ controller_roles }}"
    controller_schedules: []

- name: Apply Automation Controller configuration (ServiceNow CasC)
  ansible.builtin.include_role:
    name: infra.aap_configuration.dispatch
