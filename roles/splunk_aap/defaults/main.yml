---
splunk_aap_organization: "Ansible Product Demos (APD)"
splunk_aap_inventory: "Ansible Product Demos Inventory"
splunk_aap_machine_credential: "APD Machine Credential"
splunk_aap_project_name: "Splunk Forwarder (mad-hatter)"
splunk_aap_project_scm_url: "https://github.com/l3acon/mad-hatter.git"
splunk_aap_project_scm_branch: "main"
splunk_aap_ee_name: "Splunk Forwarder EE"
splunk_aap_ee_image: "quay.io/matferna/mh-splunk:latest"
splunk_aap_validate_certs: false

splunk_ui_url: "{{ lookup('env', 'SPLUNK_URL') }}"
splunk_ui_username: "{{ lookup('env', 'SPLUNK_USERNAME') }}"
splunk_ui_password: "{{ lookup('env', 'SPLUNK_PASSWORD') }}"
splunk_api_url: "{{ lookup('env', 'SPLUNK_API_URL') }}"
splunk_api_validate_certs: "{{ lookup('env', 'SPLUNK_API_VALIDATE_CERTS') | default('true', true) | bool }}"
splunk_receiver_host: "{{ lookup('env', 'SPLUNK_RECEIVER_HOST') | default(splunk_ui_url | urlsplit('hostname'), true) }}"
splunk_receiver_port: "{{ lookup('env', 'SPLUNK_RECEIVER_PORT') }}"
splunk_forwarder_username: "{{ lookup('env', 'SPLUNK_FORWARDER_USERNAME') | default('admin', true) }}"
splunk_forwarder_password: "{{ lookup('env', 'SPLUNK_FORWARDER_PASSWORD') }}"
splunk_forwarder_version: "9.4.7"
splunk_forwarder_release_id: "2a9293b80994"
splunk_forwarder_targets: "aws_rhel8:aws_rhel9"
splunk_demo_index: "main"
