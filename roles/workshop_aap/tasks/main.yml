---
# Deploy OpenShift Virtualization CasC to a pre-provisioned workshop AAP.
# The workshop already has AAP + CNV installed; this role adds:
#   - EE, project, credentials, inventories
#   - Job templates and workflows for VM provisioning
#
# Requires: aap_hostname, aap_username, aap_password, openshift_api_url,
#           openshift_bearer_token (set by workshop_creds role)

- name: Assert required variables
  ansible.builtin.assert:
    that:
      - aap_hostname is defined and aap_hostname | length > 0
      - aap_username is defined
      - aap_password is defined and aap_password | length > 0
      - openshift_api_url is defined and openshift_api_url | length > 0
      - openshift_bearer_token is defined and openshift_bearer_token | length > 0
    fail_msg: >-
      Missing required variables. Run the workshop_creds role first to extract
      cluster and AAP connection details.

# ── Build credentials list ──────────────────────────────────────────────────
- name: Build controller credentials
  ansible.builtin.set_fact:
    controller_credentials:
      - name: Controller Credential
        organization: Default
        credential_type: Red Hat Ansible Automation Platform
        update_secrets: false
        state: exists
        inputs:
          host: "{{ aap_hostname }}"
          username: "{{ aap_username }}"
          password: "{{ aap_password }}"
          verify_ssl: "{{ workshop_aap_verify_ssl }}"

      - name: OpenShift Credential
        credential_type: OpenShift or Kubernetes API Bearer Token
        organization: Default
        inputs:
          host: "{{ openshift_api_url }}"
          bearer_token: "{{ openshift_bearer_token }}"

      - name: "{{ workshop_aap_vm_ssh_credential_name }}"
        credential_type: Machine
        organization: Default
        update_secrets: true
        inputs:
          username: "{{ workshop_aap_vm_ssh_username }}"
          ssh_key_data: "{{ lookup('file', workshop_aap_vm_ssh_private_key_file) }}"
  no_log: true
  when: workshop_aap_vm_ssh_enabled | bool

- name: Build controller credentials (no VM SSH)
  ansible.builtin.set_fact:
    controller_credentials:
      - name: Controller Credential
        organization: Default
        credential_type: Red Hat Ansible Automation Platform
        update_secrets: false
        state: exists
        inputs:
          host: "{{ aap_hostname }}"
          username: "{{ aap_username }}"
          password: "{{ aap_password }}"
          verify_ssl: "{{ workshop_aap_verify_ssl }}"

      - name: OpenShift Credential
        credential_type: OpenShift or Kubernetes API Bearer Token
        organization: Default
        inputs:
          host: "{{ openshift_api_url }}"
          bearer_token: "{{ openshift_bearer_token }}"
  no_log: true
  when: not (workshop_aap_vm_ssh_enabled | bool)

# ── Ensure inventories (direct module calls, not dispatch) ──────────────────
- name: Ensure runtime inventory exists
  ansible.controller.inventory:
    name: "{{ workshop_aap_inventory_name }}"
    organization: Default
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: "{{ workshop_aap_verify_ssl }}"

- name: Ensure KubeVirt dynamic inventory exists
  ansible.controller.inventory:
    name: "{{ workshop_aap_kubevirt_inventory_name }}"
    organization: Default
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: "{{ workshop_aap_verify_ssl }}"

- name: Ensure KubeVirt WinRM inventory exists
  ansible.controller.inventory:
    name: "{{ workshop_aap_kubevirt_winrm_inventory_name }}"
    organization: Default
    state: present
    variables:
      ansible_connection: winrm
      ansible_winrm_scheme: http
      ansible_winrm_transport: ntlm
      ansible_winrm_server_cert_validation: ignore
      ansible_port: 5985
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: "{{ workshop_aap_verify_ssl }}"

# ── Publish CasC lists for dispatch ─────────────────────────────────────────
- name: Publish CasC lists for dispatch
  ansible.builtin.set_fact:
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    controller_execution_environments: "{{ controller_execution_environments }}"
    controller_projects: "{{ controller_projects }}"
    controller_inventories: []
    controller_inventory_sources: "{{ controller_inventory_sources }}"
    controller_hosts: "{{ controller_hosts }}"
    controller_workflows: "{{ controller_workflows }}"

# ── Dispatch ────────────────────────────────────────────────────────────────
- name: Apply CasC via dispatch
  ansible.builtin.include_role:
    name: infra.aap_configuration.dispatch
