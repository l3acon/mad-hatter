---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - apd_aap_hostname | length > 0
      - apd_aap_username | length > 0
      - apd_aap_password | length > 0
      - apd_aws_access_key | length > 0
      - apd_aws_secret_key | length > 0
      - apd_machine_credential_ssh_key | length > 0
    fail_msg: >-
      Missing required variables. Ensure apd_aap_hostname, apd_aws_access_key,
      apd_aws_secret_key, and apd_machine_credential_ssh_key are set.

# ── Organization ────────────────────────────────────────────────────────────
- name: Ensure APD organization exists
  ansible.controller.organization:
    name: "{{ apd_organization }}"
    state: present
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"
  when: apd_organization != 'Default'

# ── Project ─────────────────────────────────────────────────────────────────
- name: Ensure product-demos project exists
  ansible.controller.project:
    name: "{{ apd_project_name }}"
    organization: "{{ apd_organization }}"
    scm_type: git
    scm_url: "{{ apd_project_scm_url }}"
    scm_branch: "{{ apd_project_scm_branch }}"
    scm_update_on_launch: true
    state: present
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"
  register: _apd_project

- name: Sync product-demos project
  ansible.controller.project_update:
    project: "{{ apd_project_name }}"
    organization: "{{ apd_organization }}"
    wait: true
    timeout: 300
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"

# ── Credentials ─────────────────────────────────────────────────────────────
- name: Ensure AWS credential exists
  ansible.controller.credential:
    name: "{{ apd_aws_credential_name }}"
    organization: "{{ apd_organization }}"
    credential_type: "Amazon Web Services"
    state: present
    inputs:
      username: "{{ apd_aws_access_key }}"
      password: "{{ apd_aws_secret_key }}"
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"

- name: Ensure APD Machine credential exists
  ansible.controller.credential:
    name: "{{ apd_machine_credential_name }}"
    organization: "{{ apd_organization }}"
    credential_type: "Machine"
    state: present
    inputs:
      username: "{{ apd_machine_credential_username }}"
      ssh_key_data: "{{ apd_machine_credential_ssh_key }}"
      become_method: sudo
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"

- name: Ensure extra credentials exist
  ansible.controller.credential:
    name: "{{ item.name }}"
    organization: "{{ apd_organization }}"
    credential_type: "{{ item.credential_type }}"
    state: "{{ item.state | default('present') }}"
    inputs: "{{ item.inputs | default(omit) }}"
    update_secrets: "{{ item.update_secrets | default(true) }}"
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"
  loop: "{{ apd_extra_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  when: apd_extra_credentials | length > 0

# ── Inventory + EC2 source ──────────────────────────────────────────────────
- name: Ensure APD inventory exists
  ansible.controller.inventory:
    name: "{{ apd_inventory_name }}"
    organization: "{{ apd_organization }}"
    state: present
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"

- name: Ensure AWS EC2 inventory source exists
  ansible.controller.inventory_source:
    name: "AWS Inventory"
    inventory: "{{ apd_inventory_name }}"
    organization: "{{ apd_organization }}"
    source: ec2
    credential: "{{ apd_aws_credential_name }}"
    overwrite: true
    source_vars:
      filters:
        tag:managed-by: aap-product-demos
        tag:apd: "true"
        instance-state-name: running
      hostnames:
        - "tag:Name"
      compose:
        ansible_host: public_ip_address
        ansible_user: ec2-user
      groups:
        cloud_aws: true
        os_linux: "platform_details == 'Red Hat Enterprise Linux'"
        os_windows: "platform_details == 'Windows'"
      keyed_groups:
        - key: tags.blueprint
          prefix: blueprint
        - key: tags.owner
          prefix: owner
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"

# ── Summary ─────────────────────────────────────────────────────────────────
- name: Display APD deployment summary
  ansible.builtin.debug:
    msg:
      - "═══════════════════════════════════════════════════════"
      - "Ansible Product Demos deployed"
      - "═══════════════════════════════════════════════════════"
      - "AAP: {{ apd_aap_hostname }}"
      - "Organization: {{ apd_organization }}"
      - "Project: {{ apd_project_name }} ({{ apd_project_scm_url }})"
      - "Inventory: {{ apd_inventory_name }}"
      - "AWS Credential: {{ apd_aws_credential_name }} (region {{ apd_aws_region }})"
      - "Machine Credential: {{ apd_machine_credential_name }}"
      - "─────────────────────────────────────────────────────"
      - "Run setup_demo.yml from the AAP UI with -e demo=cloud"
      - "to create Cloud job templates."
      - "═══════════════════════════════════════════════════════"
