---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - apd_aap_hostname | length > 0
      - apd_aap_username | length > 0
      - apd_aap_password | length > 0
      - apd_aws_access_key | length > 0
      - apd_aws_secret_key | length > 0
      - apd_machine_credential_ssh_key | length > 0
    fail_msg: >-
      Missing required variables. Ensure apd_aap_hostname, apd_aws_access_key,
      apd_aws_secret_key, and apd_machine_credential_ssh_key are set.

# ── Query AAP version for EE image tag ──────────────────────────────────────
- name: Query AAP version from gateway
  ansible.builtin.uri:
    url: "{{ apd_aap_hostname | regex_replace('/$', '') }}/api/gateway/v1/ping/"
    method: GET
    validate_certs: "{{ apd_aap_validate_certs }}"
    url_username: "{{ apd_aap_username }}"
    url_password: "{{ apd_aap_password }}"
    force_basic_auth: true
  register: _apd_gw_ping

- name: Set AAP version and EE image facts
  ansible.builtin.set_fact:
    _apd_aap_version: "{{ _apd_gw_ping.json.version }}"
    _apd_ee_image: "quay.io/ansible-product-demos/apd-ee-{{ _apd_gw_ping.json.version | replace('.', '') }}:latest"

# ── Create organization directly (gateway async workaround) ─────────────────
# ── Create organization (skip for Default — gateway sync can fail on fresh installs)
- name: Ensure APD organization exists
  ansible.controller.organization:
    name: "{{ apd_organization }}"
    state: present
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"
  when: apd_organization != 'Default'

# ── Bootstrap via infra.aap_configuration.dispatch ──────────────────────────
# Mirrors install-apd.yml + common/bootstrap-vars.yml from the product-demos
# repo, but injects ROSA AWS keys and the local SSH key instead of env vars.
- name: Apply APD bootstrap CasC via dispatch
  ansible.builtin.include_role:
    name: infra.aap_configuration.dispatch
  vars:
    controller_host: "{{ apd_aap_hostname }}"
    controller_username: "{{ apd_aap_username }}"
    controller_password: "{{ apd_aap_password }}"
    validate_certs: "{{ apd_aap_validate_certs }}"
    controller_dependency_check: false

    # Disable async for gateway roles (ansible.platform 2.7 workaround)
    gateway_configuration_async_retries: 0
    controller_configuration_projects_async_retries: 90

    # Organization already created above (gateway async workaround)

    # ── Credentials ───────────────────────────────────────────────────────
    controller_credentials:
      - name: AAP Credential
        credential_type: Red Hat Ansible Automation Platform
        organization: "{{ apd_organization }}"
        update_secrets: false
        state: exists
        inputs:
          host: "{{ apd_aap_hostname }}"
          username: "{{ apd_aap_username }}"
          password: "{{ apd_aap_password }}"
          verify_ssl: "{{ apd_aap_validate_certs }}"

      - name: APD Machine Credential
        description: Machine credential for Linux (SSH key) and Windows (password) instances
        credential_type: Machine
        organization: "{{ apd_organization }}"
        update_secrets: true
        inputs:
          username: "{{ apd_machine_credential_username }}"
          ssh_key_data: "{{ apd_machine_credential_ssh_key }}"
          password: "{{ apd_machine_credential_password | default(omit) }}"

      - name: AWS
        credential_type: Amazon Web Services
        organization: "{{ apd_organization }}"
        update_secrets: true
        inputs:
          username: "{{ apd_aws_access_key }}"
          password: "{{ apd_aws_secret_key }}"

    # ── Inventory ─────────────────────────────────────────────────────────
    controller_inventories:
      - name: "{{ apd_inventory_name }}"
        organization: "{{ apd_organization }}"

    # ── Execution Environment ─────────────────────────────────────────────
    controller_execution_environments:
      - name: "{{ apd_ee_name }}"
        image: "{{ _apd_ee_image }}"

    # ── Project ───────────────────────────────────────────────────────────
    controller_projects:
      - name: "{{ apd_project_name }}"
        organization: "{{ apd_organization }}"
        scm_type: git
        scm_url: "{{ apd_project_scm_url }}"
        scm_branch: "{{ apd_project_scm_branch }}"
        default_environment: "{{ apd_ee_name }}"
        wait: true

    # ── Setup Job Templates ───────────────────────────────────────────────
    controller_templates:
      - name: "APD | Single demo setup"
        job_type: run
        inventory: "{{ apd_inventory_name }}"
        project: "{{ apd_project_name }}"
        playbook: setup_demo.yml
        credentials: AAP Credential
        execution_environment: "{{ apd_ee_name }}"
        allow_simultaneous: true
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - type: multiplechoice
              question_name: Demo Category
              variable: demo
              required: true
              choices:
                - linux
                - windows
                - cloud
                - network
                - openshift
                - infrastructure
                - satellite

      - name: "APD | Multi-demo setup"
        job_type: run
        inventory: "{{ apd_inventory_name }}"
        project: "{{ apd_project_name }}"
        playbook: multi_select_setup.yml
        credentials: AAP Credential
        execution_environment: "{{ apd_ee_name }}"
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: "Which demos do you want to configure?"
              type: multiselect
              variable: demos
              required: true
              default: "cloud\ninfrastructure\nlinux\nnetwork\nopenshift\nwindows"
              choices:
                - cloud
                - infrastructure
                - linux
                - network
                - openshift
                - satellite
                - windows

# ── Summary ─────────────────────────────────────────────────────────────────
- name: Display APD deployment summary
  ansible.builtin.debug:
    msg:
      - "═══════════════════════════════════════════════════════"
      - "Ansible Product Demos bootstrapped"
      - "═══════════════════════════════════════════════════════"
      - "AAP: {{ apd_aap_hostname }}"
      - "Organization: {{ apd_organization }}"
      - "Project: {{ apd_project_name }} ({{ apd_project_scm_url }})"
      - "EE: {{ _apd_ee_image }}"
      - "Inventory: {{ apd_inventory_name }}"
      - "AWS Credential: injected from ROSA creds"
      - "Machine Credential: APD Machine Credential"
      - "─────────────────────────────────────────────────────"
      - "Setup JTs created:"
      - "  - APD | Single demo setup (survey: demo category)"
      - "  - APD | Multi-demo setup (survey: multi-select)"
      - "Run 'APD | Single demo setup' with demo=cloud to create"
      - "Cloud job templates (Create VPC, Create VM, etc.)"
      - "═══════════════════════════════════════════════════════"
