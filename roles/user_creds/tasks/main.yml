---
- name: Load optional local credentials
  ansible.builtin.include_tasks: load.yml

- name: Resolve credentials from explicit values or the environment
  ansible.builtin.set_fact:
    aap_admin_password: "{{ aap_admin_password | default(user_creds_aap_admin_password, true) }}"
    aap_machine_cred_password: "{{ aap_machine_cred_password | default(user_creds_aap_machine_cred_password, true) }}"
    openshift_admin_password: "{{ openshift_admin_password | default(user_creds_openshift_admin_password, true) }}"
    aap_operator_chatbot_token: "{{ aap_operator_chatbot_token | default(user_creds_aap_operator_chatbot_token, true) }}"
    aap_manifest_path: "{{ aap_manifest_path | default(user_creds_aap_manifest_path, true) }}"
  no_log: true

- name: Require deployment passwords and manifest path
  ansible.builtin.assert:
    that:
      - aap_admin_password | default('', true) | string | trim | length > 0
      - openshift_admin_password | default('', true) | string | trim | length > 0
      - aap_machine_cred_password | default('', true) | string | trim | length > 0
      - aap_manifest_path | default('', true) | string | trim | length > 0
    fail_msg: >-
      Set aap_admin_password, openshift_admin_password, aap_machine_cred_password,
      and aap_manifest_path in user.creds.yml, or export CONTROLLER_PASSWORD,
      K8S_AUTH_PASSWORD, AAP_MACHINE_CRED_PASSWORD, and AAP_MANIFEST_PATH.

- name: Load the private SSH key only when no key value was supplied
  ansible.builtin.set_fact:
    aap_machine_cred_priv_key: "{{ user_creds_aap_machine_cred_priv_key }}"
  when: aap_machine_cred_priv_key | default('', true) | length == 0
  no_log: true

- name: Load the public SSH key only when no key value was supplied
  ansible.builtin.set_fact:
    aap_machine_cred_pub_key: "{{ user_creds_aap_machine_cred_pub_key }}"
  when: aap_machine_cred_pub_key | default('', true) | length == 0
  no_log: true

- name: Set the SSH key file path
  ansible.builtin.set_fact:
    ansible_ssh_private_key_file: "{{ user_creds_ansible_ssh_private_key_file }}"

- name: Check that manifest exists
  ansible.builtin.stat:
    path: "{{ aap_manifest_path }}"
  register: stat_result

- name: Assertion for required variables (when deploying ALIA)
  when: not (aap_operator_disable_lightspeed | default(true) | bool)
  ansible.builtin.assert:
    that:
      - aap_operator_chatbot_token | default('', true) | string | trim | length > 0
    fail_msg: Set aap_operator_chatbot_token or AAP_LIGHTSPEED_TOKEN when enabling Lightspeed.

- name: Assertion for required variables
  ansible.builtin.assert:
    that:
      - stat_result.stat.exists
      - stat_result.stat.isreg | default(false)
      - stat_result.stat.readable | default(false)
      - aap_admin_password|length > 0
      - openshift_admin_password|length > 0
      - aap_manifest_path|length > 0
      - aap_machine_cred_priv_key|length > 0
      # ensure RSA key
      - aap_machine_cred_priv_key is regex('^-----BEGIN (?:RSA|OPENSSH) PRIVATE KEY-----\n(.+\n)+-----END (?:RSA|OPENSSH) PRIVATE KEY-----\s*$')
      # enforce Windows password requirements
      - aap_machine_cred_password|length >= 8
      - ( (aap_machine_cred_password | regex_search('[A-Z]') | ternary(1, 0)) +
          (aap_machine_cred_password | regex_search('[a-z]') | ternary(1, 0)) +
          (aap_machine_cred_password | regex_search('[0-9]') | ternary(1, 0)) +
          (aap_machine_cred_password | regex_search('[!@#$%^&*(),.?":{}|<>]') | ternary(1, 0))
        ) >= 3
    fail_msg: >-
      Provide a readable manifest, an SSH keypair, and a machine credential password
      of at least 8 characters with 3 character classes in user.creds.yml or the environment.
