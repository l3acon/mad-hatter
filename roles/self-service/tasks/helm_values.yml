- name: Get OpenShift base domain from default IngressController
  kubernetes.core.k8s:
    api_version: operator.openshift.io/v1
    kind: IngressController
    name: default
    namespace: openshift-ingress-operator
    state: present
  register: ingress_info

- name: Set base domain fact
  set_fact:
    openshift_base_domain: "{{ ingress_info.result.status.domain }}"

- name: Fail if base domain is not defined
  fail:
    msg: "openshift_base_domain is not set. Check the IngressController or cluster access."
  when: ingress_info.result.status.domain is not defined

- name: Set base domain fact
  set_fact:
    openshift_base_domain: "{{ ingress_info.result.status.domain }}"

- name: Add Openshift repository
  kubernetes.core.helm_repository:
    name: "{{ helm_repo_name }}"
    repo_url: "{{ helm_repo_url }}"

- name: Validate compliance plugin image references
  ansible.builtin.assert:
    that:
      - ssp_plugin_mode == 'oci'
      - ssp_compliance_frontend_image is match('^oci://.+!.+')
      - ssp_compliance_backend_image is match('^oci://.+!.+')
    fail_msg: Set the two OCI plugin references, including their !package names.
  when: ssp_compliance_enabled | bool

- name: Create temporary values file for the compliance plugins
  ansible.builtin.tempfile:
    state: file
    suffix: -portal-values.yml
  register: _compliance_values_file
  when: ssp_compliance_enabled | bool

- name: Copy standard Portal values
  ansible.builtin.copy:
    src: "{{ helm_values }}"
    dest: "{{ _compliance_values_file.path }}"
    mode: '0600'
  when: ssp_compliance_enabled | bool

- name: Append compliance plugins to the standard Portal plugins
  ansible.builtin.blockinfile:
    path: "{{ _compliance_values_file.path }}"
    insertbefore: '^    imageTagInfo:'
    marker: '        # {mark} COMPLIANCE PLUGINS'
    block: |2
              - disabled: false
                package: {{ ssp_compliance_frontend_image | to_json }}
                pluginConfig:
                  dynamicPlugins:
                    frontend:
                      aap-compliance.plugin-compliance:
                        dynamicRoutes:
                          - importName: CompliancePage
                            path: /compliance/*
                            menuItem:
                              icon: security
                              text: Compliance
              - disabled: false
                package: {{ ssp_compliance_backend_image | to_json }}
                pluginConfig:
                  dynamicPlugins:
                    backend:
                      aap-compliance.plugin-compliance-backend: {}
                  ansible:
                    compliance:
                      enabled: true
                      dataSource: live
                      authMode: production
                      retentionDays: 90
  when: ssp_compliance_enabled | bool

- name: Install RHAAP chart from openshift repo
  kubernetes.core.helm:
    name: "{{ helm_release_name }}"
    release_name: "{{ helm_release_name }}"
    chart_ref: "{{ helm_repo_name }}/{{ helm_chart_name }}"
    chart_version: "{{ helm_chart_version }}"
    release_namespace: "{{ openshift_namespace }}"
    values_files: "{{ _compliance_values_file.path if ssp_compliance_enabled | bool else helm_values }}"
    release_state: present
    set_values:
      - value: redhat-developer-hub.global.clusterRouterBase={{ openshift_base_domain }}
        value_type: string
      - value: redhat-developer-hub.global.imageTagInfo={{ helm_chart_version }}
        value_type: string
      - value: redhat-developer-hub.upstream.backstage.appConfig.auth.providers.rhaap.production.checkSSL={{ aap_ssl_verify }}
        value_type: string
      - value: redhat-developer-hub.upstream.backstage.appConfig.ansible.rhaap.checkSSL={{ aap_ssl_verify }}
        value_type: string
  tags: helm

- name: Remove temporary compliance values
  ansible.builtin.file:
    path: "{{ _compliance_values_file.path }}"
    state: absent
  when: ssp_compliance_enabled | bool
