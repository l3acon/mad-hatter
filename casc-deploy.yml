---
# Apply Configuration as Code to AAP.
#
# Usage (pick feature tags):
#   ansible-navigator run casc-deploy.yml --tags snow --eei quay.io/matferna/mh-rosa:latest
#   ansible-navigator run casc-deploy.yml --tags snow,apd --eei quay.io/matferna/mh-rosa:latest
#   ansible-navigator run casc-deploy.yml --tags apd,clab --eei quay.io/matferna/mh-aro:latest
#
# Tags:
#   snow — ServiceNow integration CasC (roles: snow)
#   apd  — OpenShift Virtualization product demos CasC (role: openshift_virtualization_aap)
#   clab — ContainerLab network CasC (roles: mvnw + credential dispatch)
- name: Apply Configuration as Code
  hosts: localhost
  vars:
    aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    aap_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    snow_instance: "{{ lookup('env', 'SNOW_INSTANCE') }}"
    snow_username: "{{ lookup('env', 'SNOW_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SNOW_PASSWORD') }}"
  tasks:
    # ── always: validate AAP credentials ──────────────────────────────────
    - name: Validate AAP credentials are configured
      tags: always
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_username | length > 0
          - aap_password | length > 0
        fail_msg: >-
          Missing AAP credentials. Source the .env file or set CONTROLLER_HOST,
          CONTROLLER_USERNAME, CONTROLLER_PASSWORD.

    # ── snow: ServiceNow + AAP integration CasC ──────────────────────────
    - name: Validate SNOW credentials
      tags: [snow]
      ansible.builtin.assert:
        that:
          - snow_instance | length > 0
          - snow_username | length > 0
          - snow_password | length > 0
        fail_msg: >-
          Missing SNOW credentials. Set SNOW_INSTANCE, SNOW_USERNAME, SNOW_PASSWORD.

    - name: ServiceNow AAP configuration as code
      tags: [snow]
      ansible.builtin.include_role:
        name: snow
        apply:
          tags: [snow]
      vars:
        snow_extra_controller_credentials:
          - name: AWS
            credential_type: Amazon Web Services
            organization: Default
            update_secrets: false

    # ── shared: OCP token + gateway OAuth (for clab) ───────────────────────
    - name: Get OCP bearer token
      tags: [clab]
      ansible.builtin.command: "oc whoami --show-token" # noqa: no-changed-when
      register: oc_token_result

    - name: Set OCP bearer token
      tags: [clab]
      ansible.builtin.set_fact:
        openshift_bearer_token: "{{ oc_token_result.stdout }}"

    - name: Obtain gateway OAuth token for CasC modules
      tags: [clab]
      ansible.platform.token:
        description: "CasC dispatch token"
        scope: "write"
        state: present
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: false
      register: _casc_token_result

    - name: Set controller OAuth token for ansible.controller modules
      tags: [clab]
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ _casc_token_result.ansible_facts.aap_token.token }}"

    # ── apd: parse ROSA credentials for AWS keys ───────────────────────────
    - name: Parse ROSA credentials for AWS keys
      tags: [apd]
      ansible.builtin.include_role:
        name: rosa_creds
        apply:
          tags: [apd]
      vars:
        rosa_creds_file_path: "{{ playbook_dir }}/rosa.creds.yml"

    - name: Parse user credentials for SSH key
      tags: [apd]
      ansible.builtin.include_role:
        name: user_creds
        apply:
          tags: [apd]
      vars:
        user_creds_file_path: "{{ playbook_dir }}/user.creds.yml"

    # ── apd: Ansible Product Demos CasC ──────────────────────────────────
    - name: Ansible Product Demos configuration as code
      tags: [apd]
      ansible.builtin.include_role:
        name: product_demos
        apply:
          tags: [apd]
      vars:
        apd_aws_access_key: "{{ aws_access_key | default(lookup('env', 'AWS_ACCESS_KEY_ID')) }}"
        apd_aws_secret_key: "{{ aws_secret_key | default(lookup('env', 'AWS_SECRET_ACCESS_KEY')) }}"
        apd_machine_credential_ssh_key: "{{ aap_machine_cred_priv_key | default(lookup('file', '/root/keys/my_priv_key', errors='ignore') | default('')) }}"
        apd_machine_credential_password: "{{ aap_machine_cred_password | default(lookup('env', 'AAP_MACHINE_CRED_PASSWORD')) }}"

    # ── clab: ContainerLab network CasC ───────────────────────────────────
    - name: Run multi-vendor network workshop config as code
      tags: [clab]
      ansible.builtin.include_role:
        name: mvnw
        apply:
          tags: [clab]

    - name: Configure ContainerLab credentials # noqa: var-naming[no-role-prefix]
      tags: [clab]
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
        apply:
          tags: [clab]
      vars:
        controller_credentials:
          - name: Demo Credential
            credential_type: Machine
            update_secrets: true
            inputs:
              username: "admin"
              password: "{{ aap_machine_cred_password }}"
              ssh_key_data: "{{ aap_machine_cred_priv_key }}"
          - name: OpenShift Credential
            credential_type: "OpenShift or Kubernetes API Bearer Token"
            organization: Default
            inputs:
              host: "{{ openshift_api_url }}"
              bearer_token: "{{ openshift_bearer_token }}"

    # ── always: summary ──────────────────────────────────────────────────
    - name: Display deployment summary
      tags: always
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════"
          - "Configuration as Code Applied"
          - "═══════════════════════════════════════════════════════"
          - "AAP Gateway: {{ aap_hostname }}"
