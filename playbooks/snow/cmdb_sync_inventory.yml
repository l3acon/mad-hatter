---
- name: Sync AAP inventory from ServiceNow CMDB
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Trigger inventory source sync in AAP
      ansible.controller.inventory_source_update:
        name: "ServiceNow CMDB Source"
        inventory: "{{ snow_aap_inventory_name | default('ServiceNow CMDB Inventory') }}"
        wait: true
        controller_host: "{{ controller_host | default(lookup('env', 'CONTROLLER_HOST')) }}"
        controller_username: "{{ controller_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
        controller_password: "{{ controller_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
        validate_certs: false
      register: snow_sync_result

    - name: Display sync result
      ansible.builtin.debug:
        msg: "Inventory sync completed — status: {{ snow_sync_result.status | default('complete') }}"
