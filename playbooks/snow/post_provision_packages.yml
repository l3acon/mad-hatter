---
# Post-provisioning: install packages on a newly provisioned host.
# The host must exist in the AAP inventory (added by the Sync Inventory node).
# The workflow passes snow_vm_name via set_stats which becomes the job limit.
- name: Post-provision — install packages on target host
  hosts: all
  gather_facts: true
  become: true
  vars:
    snow_packages: ""
  tasks:
    - name: Parse package list
      ansible.builtin.set_fact:
        _package_list: >-
          {{ snow_packages | split(',') | map('trim') | select() | list }}
      when: snow_packages | length > 0

    - name: Install requested packages
      ansible.builtin.dnf:
        name: "{{ _package_list }}"
        state: present
      when:
        - snow_packages | length > 0
        - _package_list | length > 0
      register: _install_result

    - name: Display installation result
      ansible.builtin.debug:
        msg:
          - "Packages installed: {{ _package_list | default([]) | join(', ') }}"
          - "Host: {{ inventory_hostname }} ({{ ansible_host | default('localhost') }})"
      when: snow_packages | length > 0

    - name: Skip message when no packages requested
      ansible.builtin.debug:
        msg: "No packages requested — post-provision step skipped"
      when: snow_packages | length == 0
