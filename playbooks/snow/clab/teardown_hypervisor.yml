---
# Full teardown: terminate EC2 instance and remove all VPC resources.
- name: Teardown Containerlab Hypervisor and AWS Resources
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_clab_aws_region: us-east-2
    snow_clab_vpc_name: clab-snow-vpc
    snow_clab_vpc_cidr: "10.200.0.0/16"
    snow_clab_subnet_cidr: "10.200.1.0/24"
    snow_clab_sg_name: clab-snow-sg
    snow_clab_rt_name: clab-snow-rt
    snow_clab_keypair_name: clab-snow-key
    snow_clab_purpose_tag: containerlab
  tasks:
    - name: Find running clab instances
      amazon.aws.ec2_instance_info:
        region: "{{ snow_clab_aws_region }}"
        filters:
          "tag:deployment": containerlab
          "tag:purpose": "{{ snow_clab_purpose_tag }}"
          instance-state-name:
            - running
            - stopped
      register: clab_instances

    - name: Terminate EC2 instances
      amazon.aws.ec2_instance:
        state: absent
        instance_ids: "{{ clab_instances.instances | map(attribute='instance_id') | list }}"
        region: "{{ snow_clab_aws_region }}"
        wait: true
      when: clab_instances.instances | length > 0

    - name: Look up VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ snow_clab_aws_region }}"
        filters:
          "tag:Name": "{{ snow_clab_vpc_name }}"
      register: clab_vpc_info

    - name: Set VPC ID
      ansible.builtin.set_fact:
        clab_vpc_id: "{{ clab_vpc_info.vpcs[0].id }}"
      when: clab_vpc_info.vpcs | length > 0

    - name: Delete subnet
      amazon.aws.ec2_vpc_subnet:
        state: absent
        vpc_id: "{{ clab_vpc_id }}"
        cidr: "{{ snow_clab_subnet_cidr }}"
        region: "{{ snow_clab_aws_region }}"
      when: clab_vpc_id is defined

    - name: Delete route table
      amazon.aws.ec2_vpc_route_table:
        state: absent
        vpc_id: "{{ clab_vpc_id }}"
        region: "{{ snow_clab_aws_region }}"
        tags:
          Name: "{{ snow_clab_rt_name }}"
        lookup: tag
      when: clab_vpc_id is defined

    - name: Delete security group
      amazon.aws.ec2_security_group:
        state: absent
        name: "{{ snow_clab_sg_name }}"
        region: "{{ snow_clab_aws_region }}"
        vpc_id: "{{ clab_vpc_id }}"
      when: clab_vpc_id is defined

    - name: Delete internet gateway
      amazon.aws.ec2_vpc_igw:
        state: absent
        vpc_id: "{{ clab_vpc_id }}"
        region: "{{ snow_clab_aws_region }}"
      when: clab_vpc_id is defined

    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        state: absent
        name: "{{ snow_clab_vpc_name }}"
        cidr_block: "{{ snow_clab_vpc_cidr }}"
        region: "{{ snow_clab_aws_region }}"
      when: clab_vpc_id is defined

    - name: Delete keypair
      amazon.aws.ec2_key:
        name: "{{ snow_clab_keypair_name }}"
        region: "{{ snow_clab_aws_region }}"
        state: absent

    - name: Display result
      ansible.builtin.debug:
        msg: "All containerlab AWS resources in {{ snow_clab_aws_region }} removed"
