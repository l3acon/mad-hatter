---
# Provision a containerlab hypervisor on AWS.
# Creates VPC, subnet, IGW, security group, keypair, and EC2 instance with nested
# virtualization enabled. Saves the SSH key to an AAP Machine credential.
- name: Provision Containerlab Hypervisor on AWS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_clab_aws_region: us-east-2
    snow_clab_instance_type: c8i.2xlarge
    snow_clab_owner_tag: aap-snow-demo
    snow_clab_vpc_name: clab-snow-vpc
    snow_clab_vpc_cidr: "10.200.0.0/16"
    snow_clab_subnet_cidr: "10.200.1.0/24"
    snow_clab_subnet_name: clab-snow-subnet
    snow_clab_sg_name: clab-snow-sg
    snow_clab_rt_name: clab-snow-rt
    snow_clab_keypair_name: clab-snow-key
    snow_clab_admin_user: ec2-user
    snow_clab_ssh_public_key_file: /home/matt/keys/id_rsa.pub
    snow_clab_ssh_private_key_file: /home/matt/keys/id_rsa
    snow_clab_purpose_tag: containerlab
    snow_clab_ebs_size_gb: 80
    snow_clab_ebs_device: /dev/xvdb
    snow_clab_image_owners: "309956199498"
    snow_clab_image_filter: "RHEL-9*_HVM-*-x86_64-*-Hourly2-GP3"
    snow_clab_image_architecture: x86_64
  tasks:
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        state: present
        name: "{{ snow_clab_vpc_name }}"
        cidr_block: "{{ snow_clab_vpc_cidr }}"
        region: "{{ snow_clab_aws_region }}"
        tags:
          owner: "{{ snow_clab_owner_tag }}"
          purpose: "{{ snow_clab_purpose_tag }}"
      register: clab_vpc

    - name: Create internet gateway
      amazon.aws.ec2_vpc_igw:
        state: present
        vpc_id: "{{ clab_vpc.vpc.id }}"
        region: "{{ snow_clab_aws_region }}"
        tags:
          Name: "{{ snow_clab_vpc_name }}"
          owner: "{{ snow_clab_owner_tag }}"
      register: clab_igw

    - name: Create security group
      amazon.aws.ec2_security_group:
        state: present
        name: "{{ snow_clab_sg_name }}"
        description: "Containerlab hypervisor - SSH and port-mapped device access"
        region: "{{ snow_clab_aws_region }}"
        vpc_id: "{{ clab_vpc.vpc.id }}"
        rules:
          - proto: tcp
            ports:
              - 22
              - 2122-2123
            cidr_ip: 0.0.0.0/0
          - proto: icmp
            from_port: -1
            to_port: -1
            cidr_ip: 0.0.0.0/0
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        tags:
          Name: "{{ snow_clab_sg_name }}"
          owner: "{{ snow_clab_owner_tag }}"
      register: clab_sg

    - name: Create subnet
      amazon.aws.ec2_vpc_subnet:
        state: present
        vpc_id: "{{ clab_vpc.vpc.id }}"
        cidr: "{{ snow_clab_subnet_cidr }}"
        region: "{{ snow_clab_aws_region }}"
        map_public: true
        tags:
          Name: "{{ snow_clab_subnet_name }}"
          owner: "{{ snow_clab_owner_tag }}"
      register: clab_subnet

    - name: Create route table
      amazon.aws.ec2_vpc_route_table:
        state: present
        vpc_id: "{{ clab_vpc.vpc.id }}"
        region: "{{ snow_clab_aws_region }}"
        subnets:
          - "{{ clab_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ clab_igw.gateway_id }}"
        tags:
          Name: "{{ snow_clab_rt_name }}"
          owner: "{{ snow_clab_owner_tag }}"

    - name: Import known public key to AWS keypair
      amazon.aws.ec2_key:
        name: "{{ snow_clab_keypair_name }}"
        region: "{{ snow_clab_aws_region }}"
        key_material: "{{ lookup('file', snow_clab_ssh_public_key_file) }}"
        state: present

    - name: Save private key to AAP Containerlab SSH credential
      block:
        - name: Set controller connection vars
          ansible.builtin.set_fact:
            _ctrl_host: "{{ controller_host | default(lookup('env', 'CONTROLLER_HOST')) | regex_replace('/$', '') }}"
            _ctrl_user: "{{ controller_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
            _ctrl_pass: "{{ controller_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"

        - name: Look up Containerlab SSH credential
          ansible.builtin.uri:
            url: "{{ _ctrl_host }}/api/controller/v2/credentials/?name=Containerlab+SSH"
            method: GET
            user: "{{ _ctrl_user }}"
            password: "{{ _ctrl_pass }}"
            force_basic_auth: true
            validate_certs: false
          register: _cred_lookup

        - name: Update credential with known private key
          when: _cred_lookup.json.count > 0
          ansible.builtin.uri:
            url: "{{ _ctrl_host }}/api/controller/v2/credentials/{{ (_cred_lookup.json.results | first).id }}/"
            method: PATCH
            user: "{{ _ctrl_user }}"
            password: "{{ _ctrl_pass }}"
            force_basic_auth: true
            validate_certs: false
            body_format: json
            body:
              inputs:
                username: "{{ snow_clab_admin_user }}"
                ssh_key_data: "{{ lookup('file', snow_clab_ssh_private_key_file) }}"

        - name: Create credential if not found
          when: _cred_lookup.json.count == 0
          ansible.builtin.uri:
            url: "{{ _ctrl_host }}/api/controller/v2/credentials/"
            method: POST
            user: "{{ _ctrl_user }}"
            password: "{{ _ctrl_pass }}"
            force_basic_auth: true
            validate_certs: false
            body_format: json
            body:
              name: Containerlab SSH
              organization: 1
              credential_type: 7
              inputs:
                username: "{{ snow_clab_admin_user }}"
                ssh_key_data: "{{ lookup('file', snow_clab_ssh_private_key_file) }}"
            status_code:
              - 200
              - 201

    - name: Find RHEL 9 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ snow_clab_aws_region }}"
        owners:
          - "{{ snow_clab_image_owners }}"
        filters:
          name: "{{ snow_clab_image_filter }}"
          architecture: "{{ snow_clab_image_architecture }}"
      register: clab_ami_results

    - name: Select latest AMI
      ansible.builtin.set_fact:
        clab_ami_id: "{{ (clab_ami_results.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        state: running
        name: clab-hypervisor
        instance_type: "{{ snow_clab_instance_type }}"
        image_id: "{{ clab_ami_id }}"
        key_name: "{{ snow_clab_keypair_name }}"
        region: "{{ snow_clab_aws_region }}"
        vpc_subnet_id: "{{ clab_subnet.subnet.id }}"
        security_group: "{{ clab_sg.group_id }}"
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: 30
              volume_type: gp3
              delete_on_termination: true
          - device_name: "{{ snow_clab_ebs_device }}"
            ebs:
              volume_size: "{{ snow_clab_ebs_size_gb }}"
              volume_type: gp3
              delete_on_termination: true
        tags:
          owner: "{{ snow_clab_owner_tag }}"
          purpose: "{{ snow_clab_purpose_tag }}"
          deployment: containerlab
        wait: true
      register: clab_ec2

    - name: Get instance ID
      ansible.builtin.set_fact:
        clab_instance_id: "{{ clab_ec2.instances[0].instance_id }}"

    - name: Stop instance to enable nested virtualization
      amazon.aws.ec2_instance:
        state: stopped
        instance_ids:
          - "{{ clab_instance_id }}"
        region: "{{ snow_clab_aws_region }}"
        wait: true

    - name: Enable nested virtualization via raw EC2 API
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
            import boto3
            from botocore.auth import SigV4Auth
            from botocore.awsrequest import AWSRequest
            import urllib.parse
            import urllib.request
            import ssl

            region = '{{ snow_clab_aws_region }}'
            instance_id = '{{ clab_instance_id }}'
            endpoint = f'https://ec2.{region}.amazonaws.com/'

            session = boto3.Session()
            credentials = session.get_credentials().get_frozen_credentials()

            # Try ModifyInstanceCpuOptions (newer API for nested virt)
            params = {
                'Action': 'ModifyInstanceCpuOptions',
                'InstanceId': instance_id,
                'NestedVirtualization': 'enabled',
                'Version': '2016-11-15'
            }
            body = urllib.parse.urlencode(params)
            request = AWSRequest(method='POST', url=endpoint, data=body,
                                headers={'Content-Type': 'application/x-www-form-urlencoded'})
            SigV4Auth(credentials, 'ec2', region).add_auth(request)

            ctx = ssl.create_default_context()
            req = urllib.request.Request(endpoint, data=body.encode(),
                                        headers=dict(request.headers))
            try:
                resp = urllib.request.urlopen(req, context=ctx)
                print(f'ModifyInstanceCpuOptions succeeded (status: {resp.status})')
                print(resp.read().decode()[:200])
            except urllib.error.HTTPError as e:
                error_body = e.read().decode()
                print(f'ModifyInstanceCpuOptions failed ({e.code}): {error_body[:300]}')

                # Fallback: try ModifyInstanceAttribute with NestedVirtualization
                params2 = {
                    'Action': 'ModifyInstanceAttribute',
                    'InstanceId': instance_id,
                    'NestedVirtualization.Value': 'true',
                    'Version': '2016-11-15'
                }
                body2 = urllib.parse.urlencode(params2)
                request2 = AWSRequest(method='POST', url=endpoint, data=body2,
                                      headers={'Content-Type': 'application/x-www-form-urlencoded'})
                SigV4Auth(credentials, 'ec2', region).add_auth(request2)
                req2 = urllib.request.Request(endpoint, data=body2.encode(),
                                             headers=dict(request2.headers))
                try:
                    resp2 = urllib.request.urlopen(req2, context=ctx)
                    print(f'ModifyInstanceAttribute fallback succeeded ({resp2.status})')
                except urllib.error.HTTPError as e2:
                    print(f'Both methods failed. Last error: {e2.read().decode()[:200]}')
      changed_when: true

    - name: Start instance
      amazon.aws.ec2_instance:
        state: running
        instance_ids:
          - "{{ clab_instance_id }}"
        region: "{{ snow_clab_aws_region }}"
        wait: true

    - name: Get instance public IP
      amazon.aws.ec2_instance_info:
        instance_ids:
          - "{{ clab_instance_id }}"
        region: "{{ snow_clab_aws_region }}"
      register: clab_ec2_info

    - name: Set host IP
      ansible.builtin.set_fact:
        clab_host_ip: "{{ clab_ec2_info.instances[0].public_ip_address }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        port: 22
        host: "{{ clab_host_ip }}"
        search_regex: OpenSSH
        delay: 10
        timeout: 300

    - name: Export connection info
      ansible.builtin.set_stats:
        data:
          clab_host_ip: "{{ clab_host_ip }}"
          clab_aws_region: "{{ snow_clab_aws_region }}"
          clab_instance_id: "{{ clab_instance_id }}"
          clab_vpc_id: "{{ clab_vpc.vpc.id }}"
        per_host: false

    - name: Display connection info
      ansible.builtin.debug:
        msg:
          - "Hypervisor public IP: {{ clab_host_ip }}"
          - "Instance ID: {{ clab_instance_id }}"
          - "Instance type: {{ snow_clab_instance_type }}"
          - "Region: {{ snow_clab_aws_region }}"
