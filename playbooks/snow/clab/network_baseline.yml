---
# Network Baseline Check: Verify that containerlab devices have MOTD configured.
# If any device is missing the MOTD banner, creates a ServiceNow Change Request
# to remediate via the Configure Devices job template.
- name: Discover Containerlab Hypervisor
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_clab_aws_region: us-east-2
    snow_clab_purpose_tag: containerlab
  tasks:
    - name: Check if hosts already have ansible_host
      ansible.builtin.set_fact:
        _need_discovery: "{{ hostvars['n9kv']['ansible_host'] | default('') | length == 0 }}"

    - name: Discover hypervisor IP from EC2 tags
      when: _need_discovery | bool
      amazon.aws.ec2_instance_info:
        region: "{{ snow_clab_aws_region }}"
        filters:
          "tag:deployment": containerlab
          "tag:purpose": "{{ snow_clab_purpose_tag }}"
          instance-state-name: running
      register: _clab_instances

    - name: Update host variables with discovered IP
      when:
        - _need_discovery | bool
        - _clab_instances.instances | default([]) | length > 0
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_host: "{{ _clab_instances.instances[0].public_ip_address }}"
      loop:
        - n9kv
        - cat8kv

- name: Wait for devices to be SSH-ready
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Wait for n9kv SSH (port 2122)
      ansible.builtin.wait_for:
        host: "{{ hostvars['n9kv']['ansible_host'] }}"
        port: 2122
        delay: 5
        timeout: 300
        sleep: 10

    - name: Wait for cat8kv SSH (port 2123)
      ansible.builtin.wait_for:
        host: "{{ hostvars['cat8kv']['ansible_host'] }}"
        port: 2123
        delay: 5
        timeout: 300
        sleep: 10

    - name: Additional settle time for device SSH subsystems
      ansible.builtin.pause:
        seconds: 15

- name: Network Baseline — Check MOTD on NX-OS
  hosts: clab_nxos
  gather_facts: false
  tasks:
    - name: Check for MOTD banner
      cisco.nxos.nxos_command:
        commands:
          - show banner motd
      register: _nxos_banner

    - name: Evaluate NX-OS compliance
      ansible.builtin.set_stats:
        data:
          nxos_motd_compliant: "{{ _nxos_banner.stdout[0] | length > 0 }}"
        per_host: false

    - name: Display NX-OS banner status
      ansible.builtin.debug:
        msg: "NX-OS MOTD: {{ 'configured' if (_nxos_banner.stdout[0] | length > 0) else 'MISSING' }}"

- name: Network Baseline — Check MOTD on IOS-XE
  hosts: clab_ios
  gather_facts: false
  tasks:
    - name: Check for MOTD banner
      cisco.ios.ios_command:
        commands:
          - show banner motd
      register: _ios_banner

    - name: Evaluate IOS-XE compliance
      ansible.builtin.set_stats:
        data:
          ios_motd_compliant: "{{ _ios_banner.stdout[0] | length > 0 }}"
        per_host: false

    - name: Display IOS-XE banner status
      ansible.builtin.debug:
        msg: "IOS-XE MOTD: {{ 'configured' if (_ios_banner.stdout[0] | length > 0) else 'MISSING' }}"

- name: Network Baseline — Evaluate and Remediate
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    nxos_motd_compliant: "false"
    ios_motd_compliant: "false"
  tasks:
    - name: Determine overall compliance
      ansible.builtin.set_fact:
        _all_compliant: "{{ (nxos_motd_compliant | bool) and (ios_motd_compliant | bool) }}"

    - name: Display compliance status
      ansible.builtin.debug:
        msg:
          - "NX-OS MOTD compliant: {{ nxos_motd_compliant }}"
          - "IOS-XE MOTD compliant: {{ ios_motd_compliant }}"
          - "Overall: {{ 'PASS' if _all_compliant | bool else 'FAIL — remediation required' }}"

    - name: Create Change Request for remediation
      when: not (_all_compliant | bool)
      block:
        - name: Identify non-compliant devices
          ansible.builtin.set_fact:
            _non_compliant: >-
              {{ []
                 + (['n9kv (NX-OS)'] if not (nxos_motd_compliant | bool) else [])
                 + (['cat8kv (IOS-XE)'] if not (ios_motd_compliant | bool) else [])
              }}

        - name: Create change request in ServiceNow
          servicenow.itsm.change_request:
            instance:
              host: "{{ snow_instance }}"
              username: "{{ snow_username }}"
              password: "{{ snow_password }}"
            state: new
            type: standard
            short_description: "Network Baseline Remediation — Configure MOTD Banner"
            description: |
              Automated baseline check detected missing MOTD banner configuration.

              Non-compliant devices: {{ _non_compliant | join(', ') }}

              Remediation: Apply standard MOTD banner, NTP, and SNMP configuration
              via the AAP "Configure Devices" job template.

              This change request was automatically generated by the Network Baseline
              check in Ansible Automation Platform.
            other:
              category: "Network"
              assignment_group: "Service Desk"
              justification: "Automated compliance remediation - devices missing required MOTD banner"
              risk_impact_analysis: "Low risk - applies standard configuration to lab devices"
          register: _cr_result

        - name: Display change request
          ansible.builtin.debug:
            msg:
              - "Change Request created: {{ _cr_result.record.number }}"
              - "sys_id: {{ _cr_result.record.sys_id }}"
              - "Non-compliant: {{ _non_compliant | join(', ') }}"
              - ""
              - "Approve and move to 'Implement' to trigger AAP remediation"

    - name: All devices compliant
      when: _all_compliant | bool
      ansible.builtin.debug:
        msg: "All network devices are compliant — no action needed"
